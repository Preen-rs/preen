[package]
name = "preen-os"
version = "0.1.0"
edition = "2024"
description = "Operating System abstraction layer for Preen, implementing platform-specific logic."
license = "MIT"
repository = "https://github.com/Preen-rs/preen.git"
readme = "README.md"

[dependencies]
preen-core = { path = "../preen-core" }
#preen-core = "0.1.0"
shellexpand = "2.0"
uuid = { version = "1.0", features = ["v4"] }

# File system traversal
walkdir = "2.5"

# Trash functionality
trash = "3.3.1"

# Path manipulation and globbing
glob = "0.3"

# Parallel processing
rayon = "1.10"

# User-specific directories
users = "0.11"


# Async traits
async-trait = "0.1"

# Tokio for async runtime
tokio = { version = "1", features = ["full"] }

# Regex for scan rules
regex = "1.10"

# Chrono for date/time operations
chrono = { version = "0.4", features = ["serde"] }
config = "0.15.19"
aes-gcm = "0.10"
rand = "0.8"
thiserror = "1.0"
hex = "0.4"
keyring = "2.3"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
dirs = "5.0"

[dev-dependencies]
tempfile = "3.10"
